plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sixplus.analyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sixplus.analyzer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
