name: Extract Android Project

on:
  push:
    paths:
      - '6plus_analyzer_source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q 6plus_analyzer_source.zip -d extracted
          cp -R extracted/6plus_analyzer/. .
          rm -rf extracted
          rm -f 6plus_analyzer_source.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Android project source" || exit 0
          git push
