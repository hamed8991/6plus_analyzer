name: Build Generic Calibration Demo APK

on:
  push:
    branches:
      - calibration-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build standalone demo APK
        run: gradle --no-daemon :calibration-demo:assembleDebug

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: generic-region-calibration-demo
          path: calibration-demo/build/outputs/apk/debug/calibration-demo-debug.apk
          if-no-files-found: error
